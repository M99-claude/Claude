name: Denná synchronizácia transakcií

on:
  schedule:
    # Cieľ: 06:00 v Bratislave. GitHub pozná len UTC, preto dva behy –
    # 04:00 UTC = 06:00 letného času (CEST), 05:00 UTC = 06:00 zimného času (CET).
    # Job „time-check“ pustí ďalej len ten, ktorý práve zodpovedá 6:00.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Počet dní dozadu (1 = len včerajšok)"
        default: "1"

concurrency: bank-sync

jobs:
  time-check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # +0200 = letný čas → beh o 04:00 UTC, +0100 = zimný čas → beh o 05:00 UTC
          if [ "$(TZ=Europe/Bratislava date +%z)" = "+0200" ]; then wanted="0 4 * * *"; else wanted="0 5 * * *"; fi
          if [ "$SCHEDULE" = "$wanted" ]; then echo "run=true"; else echo "run=false"; fi >> "$GITHUB_OUTPUT"

  sync:
    needs: time-check
    if: needs.time-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Konfigurácia zo secretu
        run: printf '%s' "$CONFIG_YAML" > config.yaml
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}

      - name: Synchronizácia
        run: python -m bank_sync sync --days "$DAYS"
        env:
          DAYS: ${{ inputs.days || '1' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ENABLEBANKING_PRIVATE_KEY: ${{ secrets.ENABLEBANKING_PRIVATE_KEY }}
          # Pre každý Fio účet jeden riadok – názov musí sedieť s token_env v konfigurácii.
          FIO_TOKEN_1: ${{ secrets.FIO_TOKEN_1 }}
          FIO_TOKEN_2: ${{ secrets.FIO_TOKEN_2 }}
          FIO_TOKEN_3: ${{ secrets.FIO_TOKEN_3 }}
